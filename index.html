<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord User Lookup</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Discord User Lookup</h1>
        <form id="userForm">
            <label for="userId">Enter Discord User ID</label>
            <input type="text" id="userId" name="userId" placeholder="e.g., 123456789012345678" required>
            <button type="submit">
                <span>Lookup User</span>
            </button>
        </form>
        <div id="userInfo"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
